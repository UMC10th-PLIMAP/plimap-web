services:
  web:
    image: ghcr.io/${GHCR_OWNER}/plimap-web@${IMAGE_DIGEST}
    pull_policy: never
    restart: unless-stopped
    init: true
    user: '101:101'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=101,gid=101
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 16m
    cpus: 0.25
    pids_limit: 50
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - preview-internal
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'

networks:
  preview-internal:
    internal: true
