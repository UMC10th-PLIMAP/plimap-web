name: release-deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: release-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: plimap-web
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH || '/opt/plimap-web' }}
  BUILDKIT_PROGRESS: quiet
  DOCKER_BUILD_CHECKS_ANNOTATIONS: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  DOCKER_BUILD_SUMMARY: 'false'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_TAG="${GITHUB_SHA::12}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            IMAGE_TAG="manual-${GITHUB_SHA::12}"
          fi

          echo "image_owner=${IMAGE_OWNER}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate deployment config
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KNOWN_HOSTS: ${{ secrets.DEPLOY_HOST_KNOWN_HOSTS }}
          DEPLOY_HOST_SSH_KEY: ${{ secrets.DEPLOY_HOST_SSH_KEY }}
          DEPLOY_HOST_PORT: ${{ secrets.DEPLOY_HOST_PORT || vars.DEPLOY_HOST_PORT || 22 }}
          DEPLOY_HOST_USER: ${{ secrets.DEPLOY_HOST_USER || vars.DEPLOY_HOST_USER || 'deploy' }}
          HOST_PORT: ${{ secrets.HOST_PORT || vars.HOST_PORT || 3000 }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME || vars.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          required_vars=(
            VITE_API_BASE_URL
            DEPLOY_HOST
            DEPLOY_HOST_KNOWN_HOSTS
            DEPLOY_HOST_SSH_KEY
            DEPLOY_HOST_USER
            GHCR_PULL_USERNAME
            GHCR_PULL_TOKEN
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "${name} must be configured for this workflow." >&2
              exit 1
            fi
          done

          if [[ ! "$GHCR_PULL_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "GHCR_PULL_USERNAME may contain only letters, numbers, dots, underscores, and dashes." >&2
            exit 1
          fi

          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH must be an absolute path containing only letters, numbers, dots, underscores, dashes, and slashes." >&2
            exit 1
          fi

          if [[ ! "$DEPLOY_HOST_PORT" =~ ^[0-9]+$ ]] || (( DEPLOY_HOST_PORT < 1 || DEPLOY_HOST_PORT > 65535 )); then
            echo "DEPLOY_HOST_PORT must be a TCP port between 1 and 65535." >&2
            exit 1
          fi

          if [[ ! "$HOST_PORT" =~ ^[0-9]+$ ]] || (( HOST_PORT < 1 || HOST_PORT > 65535 )); then
            echo "HOST_PORT must be a TCP port between 1 and 65535." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_KAKAO_REST_API_KEY=${{ secrets.VITE_KAKAO_REST_API_KEY }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_HOST_SSH_KEY }}
          log-public-key: false

      - name: Trust deploy host
        shell: bash
        env:
          DEPLOY_HOST_KNOWN_HOSTS: ${{ secrets.DEPLOY_HOST_KNOWN_HOSTS }}
        run: |
          if [[ -z "$DEPLOY_HOST_KNOWN_HOSTS" ]]; then
            echo "DEPLOY_HOST_KNOWN_HOSTS must be set as a GitHub Secret." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_HOST_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload production files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_PORT: ${{ secrets.DEPLOY_HOST_PORT || vars.DEPLOY_HOST_PORT || 22 }}
          DEPLOY_HOST_USER: ${{ secrets.DEPLOY_HOST_USER || vars.DEPLOY_HOST_USER || 'deploy' }}
        run: |
          ssh -p "$DEPLOY_HOST_PORT" "$DEPLOY_HOST_USER@$DEPLOY_HOST" "mkdir -p '${DEPLOY_PATH}'"
          scp -P "$DEPLOY_HOST_PORT" docker-compose.prod.yml "$DEPLOY_HOST_USER@$DEPLOY_HOST:${DEPLOY_PATH}/docker-compose.prod.yml"

      - name: Upload deploy script
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_PORT: ${{ secrets.DEPLOY_HOST_PORT || vars.DEPLOY_HOST_PORT || 22 }}
          DEPLOY_HOST_USER: ${{ secrets.DEPLOY_HOST_USER || vars.DEPLOY_HOST_USER || 'deploy' }}
        run: |
          cat > deploy.sh <<'REMOTE'
          set -euo pipefail

          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${GHCR_OWNER:?GHCR_OWNER is required}"
          : "${IMAGE_TAG:?IMAGE_TAG is required}"
          : "${HOST_PORT:?HOST_PORT is required}"
          : "${GHCR_PULL_USERNAME:?GHCR_PULL_USERNAME is required}"

          cd "$DEPLOY_PATH"

          umask 077
          printf '%s\n' \
            "GHCR_OWNER=$GHCR_OWNER" \
            "IMAGE_TAG=$IMAGE_TAG" \
            "HOST_PORT=$HOST_PORT" \
            > .env

          docker_config="$(mktemp -d)"
          diagnostic_log="${DEPLOY_PATH}/.deploy-last.log"

          if [[ -L "$diagnostic_log" ||
                ( -e "$diagnostic_log" && ! -f "$diagnostic_log" ) ]]; then
            echo "Deployment diagnostic path is unsafe." >&2
            exit 1
          fi

          : > "$diagnostic_log"
          chmod 0600 "$diagnostic_log"
          export DOCKER_CONFIG="$docker_config"
          trap 'rm -rf "$docker_config"' EXIT

          IFS= read -r ghcr_pull_token
          if ! printf '%s' "$ghcr_pull_token" |
            docker login ghcr.io -u "$GHCR_PULL_USERNAME" --password-stdin \
              >> "$diagnostic_log" 2>&1
          then
            echo "Registry authentication failed; inspect the protected host diagnostic." >&2
            exit 1
          fi

          if ! docker compose -f docker-compose.prod.yml pull --quiet \
            >> "$diagnostic_log" 2>&1
          then
            echo "Production image pull failed; inspect the protected host diagnostic." >&2
            exit 1
          fi

          if ! docker compose -f docker-compose.prod.yml up -d --remove-orphans \
            >> "$diagnostic_log" 2>&1
          then
            echo "Production container update failed; inspect the protected host diagnostic." >&2
            exit 1
          fi

          docker image prune -f >> "$diagnostic_log" 2>&1 || true
          REMOTE

          scp -P "$DEPLOY_HOST_PORT" deploy.sh "$DEPLOY_HOST_USER@$DEPLOY_HOST:${DEPLOY_PATH}/deploy.sh"
          ssh -p "$DEPLOY_HOST_PORT" "$DEPLOY_HOST_USER@$DEPLOY_HOST" "chmod 700 '${DEPLOY_PATH}/deploy.sh'"

      - name: Deploy on host
        shell: bash
        env:
          GHCR_OWNER: ${{ steps.meta.outputs.image_owner }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          HOST_PORT: ${{ secrets.HOST_PORT || vars.HOST_PORT || 3000 }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME || vars.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_PORT: ${{ secrets.DEPLOY_HOST_PORT || vars.DEPLOY_HOST_PORT || 22 }}
          DEPLOY_HOST_USER: ${{ secrets.DEPLOY_HOST_USER || vars.DEPLOY_HOST_USER || 'deploy' }}
        run: |
          quote() {
            printf '%q' "$1"
          }

          remote_command=$(printf 'GHCR_OWNER=%s IMAGE_TAG=%s HOST_PORT=%s GHCR_PULL_USERNAME=%s DEPLOY_PATH=%s bash %s' \
            "$(quote "$GHCR_OWNER")" \
            "$(quote "$IMAGE_TAG")" \
            "$(quote "$HOST_PORT")" \
            "$(quote "$GHCR_PULL_USERNAME")" \
            "$(quote "$DEPLOY_PATH")" \
            "$(quote "$DEPLOY_PATH/deploy.sh")")

          printf '%s\n' "$GHCR_PULL_TOKEN" | ssh -p "$DEPLOY_HOST_PORT" "$DEPLOY_HOST_USER@$DEPLOY_HOST" "$remote_command"
