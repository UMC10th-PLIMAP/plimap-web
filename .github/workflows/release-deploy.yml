name: release-deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: plimap-web
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/plimap-web' }}
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_TAG="${GITHUB_REF_NAME}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${IMAGE_TAG}" == "${GITHUB_REF_NAME}" ]]; then
            IMAGE_TAG="manual-${GITHUB_SHA::7}"
          fi

          echo "image_owner=${IMAGE_OWNER}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL || 'http://localhost:8080' }}
            VITE_NAVER_MAP_CLIENT_ID=${{ secrets.VITE_NAVER_MAP_CLIENT_ID }}
            VITE_KAKAO_REST_API_KEY=${{ secrets.VITE_KAKAO_REST_API_KEY }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_HOST_SSH_KEY }}
          log-public-key: false

      - name: Trust deploy host
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_HOST_PORT || vars.DEPLOY_HOST_PORT || 22 }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload production files
        shell: bash
        run: |
          DEPLOY_HOST_USER="${{ secrets.DEPLOY_HOST_USER || vars.DEPLOY_HOST_USER || 'deploy' }}"
          DEPLOY_HOST_PORT="${{ secrets.DEPLOY_HOST_PORT || vars.DEPLOY_HOST_PORT || 22 }}"
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"

          ssh -p "$DEPLOY_HOST_PORT" "$DEPLOY_HOST_USER@$DEPLOY_HOST" "mkdir -p '${DEPLOY_PATH}'"
          scp -P "$DEPLOY_HOST_PORT" docker-compose.prod.yml "$DEPLOY_HOST_USER@$DEPLOY_HOST:${DEPLOY_PATH}/docker-compose.prod.yml"

      - name: Deploy on host
        shell: bash
        env:
          GHCR_OWNER: ${{ steps.meta.outputs.image_owner }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          HOST_PORT: ${{ secrets.HOST_PORT || vars.HOST_PORT || 3000 }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME || vars.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_PORT: ${{ secrets.DEPLOY_HOST_PORT || vars.DEPLOY_HOST_PORT || 22 }}
          DEPLOY_HOST_USER: ${{ secrets.DEPLOY_HOST_USER || vars.DEPLOY_HOST_USER || 'deploy' }}
        run: |
          ssh -p "$DEPLOY_HOST_PORT" "$DEPLOY_HOST_USER@$DEPLOY_HOST" \
            GHCR_OWNER="$GHCR_OWNER" \
            IMAGE_TAG="$IMAGE_TAG" \
            HOST_PORT="$HOST_PORT" \
            GHCR_PULL_USERNAME="$GHCR_PULL_USERNAME" \
            GHCR_PULL_TOKEN="$GHCR_PULL_TOKEN" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          umask 077
          printf '%s\n' \
            "GHCR_OWNER=$GHCR_OWNER" \
            "IMAGE_TAG=$IMAGE_TAG" \
            "HOST_PORT=$HOST_PORT" \
            > .env

          printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USERNAME" --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          REMOTE
