name: 기능 개발
description: PLIMAP 기능 구현 이슈를 작성합니다.
title: 'feat: '
labels:
  - feature
body:
  - type: textarea
    id: description
    attributes:
      label: 기능 설명
      description: 어떤 기능을 개발해야 하는지 구체적으로 작성해주세요.
      placeholder: 예) 사용자가 장소를 검색하고 지도에서 선택할 수 있습니다.
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 개발 목적
      description: 이 기능이 왜 필요한지, 어떤 문제를 해결하는지 작성해주세요.
      placeholder: 예) 핀 등록 전 정확한 장소 좌표를 선택하기 위해 필요합니다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 구현해야 할 세부 작업을 체크리스트로 작성해주세요.
      value: |
        - [ ] 기능 세부 구현 항목 1
        - [ ] 기능 세부 구현 항목 2
    validations:
      required: true

  - type: textarea
    id: related_issues
    attributes:
      label: 관련 이슈
      description: 연결된 이슈가 있다면 작성해주세요.
      value: |
        - Related to #
        - Depends on #
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 비고
      description: 추가 논의할 사항이나 참고해야 할 내용을 작성해주세요.
    validations:
      required: false
